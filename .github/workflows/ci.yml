name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
      - run: bun run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: wirebot:ci
      - name: Image smoke test
        run: |
          test "$(docker run --rm wirebot:ci version)" = "$(jq -r .version package.json)"
          docker run --rm --entrypoint sh wirebot:ci -c \
            'ls /opt/wirebot/app/node_modules/@anthropic-ai/ | grep -q "claude-agent-sdk-linux-"' 
